<style>
:root{
  --bg:#0d0d0f; --card:#141318; --d2:#121114;
  --g5:#e8b84b; --g4:#c9960c;
  --t1:#ffffff; --t2:#c8c4d0; --t3:#a0a0b8;
  --border:#2a2736; --red:#f26d6d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 48px;border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--g5);text-decoration:none;letter-spacing:1px;}
.nav-back{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:13px;text-decoration:none;transition:color .2s;}
.nav-back:hover{color:var(--g5);}
.nav-back svg{width:16px;height:16px;}

/* HERO */
.hero{text-align:center;padding:80px 24px 48px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(232,184,75,0.3);border-radius:99px;padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--g5);text-transform:uppercase;margin-bottom:28px;}
.hero-badge-dot{width:7px;height:7px;border-radius:50%;background:var(--g5);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(36px,6vw,64px);font-weight:700;line-height:1.1;margin-bottom:20px;}
.hero h1 span{color:var(--g5);}
.hero p{font-size:17px;color:var(--t3);max-width:520px;margin:0 auto;line-height:1.7;}

/* COURSES */
.courses-section{max-width:1000px;margin:0 auto;padding:20px 24px 80px;}
#mainCourseList{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:20px;}

.course-card{
  display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:0;margin-bottom:0;
  transition:border-color .2s,transform .2s;cursor:pointer;text-decoration:none;
  position:relative;overflow:hidden;
}
.course-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(232,184,75,0.04) 0%,transparent 60%);
  opacity:0;transition:opacity .3s;
}
.course-card:hover{border-color:rgba(232,184,75,0.4);transform:translateY(-2px);}
.course-card:hover::before{opacity:1;}

.course-card.smc{background:linear-gradient(135deg,#141318 0%,#1a1520 100%);}
.course-card.smc:hover{border-color:rgba(232,184,75,0.5);}

.course-icon{font-size:36px;flex-shrink:0;width:60px;height:60px;display:flex;align-items:center;justify-content:center;background:rgba(232,184,75,0.08);border-radius:14px;border:1px solid rgba(232,184,75,0.15);}
.course-meta{flex:1;}
.course-tags{display:flex;gap:8px;margin-bottom:10px;}
.tag{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);}
.tag.gold{color:var(--g5);}
.tag-dot{color:var(--t3);font-size:10px;}
.course-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--t1);margin-bottom:8px;}
.course-desc{font-size:14px;color:var(--t3);line-height:1.6;max-width:580px;}
.course-btn{
  flex-shrink:0;background:rgba(232,184,75,0.12);border:1px solid rgba(232,184,75,0.3);
  color:var(--g5);font-size:14px;font-weight:600;padding:12px 24px;border-radius:10px;
  white-space:nowrap;transition:all .2s;font-family:'Space Grotesk',sans-serif;
}
.course-card:hover .course-btn{background:var(--g5);color:#0d0d0f;}
.course-card.smc .course-btn{background:rgba(232,184,75,0.15);border-color:rgba(232,184,75,0.4);}

/* AI ASSISTANT */
#ai-bubble{
  position:fixed;bottom:28px;right:28px;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--g4),var(--g5));
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:0 4px 20px rgba(232,184,75,0.4);
  z-index:999;transition:transform .2s,box-shadow .2s;
}
#ai-bubble:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(232,184,75,0.55);}

#ai-panel{
  position:fixed;bottom:96px;right:28px;
  width:360px;max-height:520px;
  background:#16141c;border:1px solid var(--border);border-radius:18px;
  display:none;flex-direction:column;z-index:998;
  box-shadow:0 16px 48px rgba(0,0,0,0.6);overflow:hidden;
}
#ai-panel.open{display:flex;}

.ai-hdr{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--border);
  background:#1a1724;
}
.ai-hdr-icon{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--g4),var(--g5));display:flex;align-items:center;justify-content:center;font-size:16px;}
.ai-hdr-text{flex:1;}
.ai-hdr-name{font-weight:700;font-size:14px;color:var(--t1);}
.ai-hdr-sub{font-size:11px;color:var(--t3);}
.ai-close{background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;padding:4px;line-height:1;}
.ai-close:hover{color:var(--t1);}

#ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:200px;}
#ai-msgs::-webkit-scrollbar{width:4px;}
#ai-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.msg{max-width:85%;font-size:13.5px;line-height:1.55;padding:10px 14px;border-radius:12px;word-break:break-word;}
.msg.bot{background:#211f2d;color:var(--t2);border-radius:12px 12px 12px 2px;align-self:flex-start;}
.msg.user{background:linear-gradient(135deg,rgba(232,184,75,0.2),rgba(201,150,12,0.15));color:var(--t1);border:1px solid rgba(232,184,75,0.2);border-radius:12px 12px 2px 12px;align-self:flex-end;}
.msg.typing{color:var(--t3);font-style:italic;}

.ai-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:#1a1724;}
#ai-input{
  flex:1;background:#0d0d0f;border:1px solid var(--border);border-radius:10px;
  color:var(--t1);font-size:13px;padding:10px 14px;outline:none;font-family:'Inter',sans-serif;
  resize:none;
}
#ai-input:focus{border-color:rgba(232,184,75,0.4);}
#ai-input::placeholder{color:var(--t3);}
#ai-send{
  width:38px;height:38px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--g4),var(--g5));
  color:#0d0d0f;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity .2s;align-self:flex-end;
}
#ai-send:hover{opacity:.85;}
#ai-send:disabled{opacity:.4;cursor:not-allowed;}

@media(max-width:640px){
  nav{padding:14px 20px;}
  .hero{padding:48px 20px 32px;}
  .courses-section{padding:10px 16px 60px;}
  #mainCourseList{grid-template-columns:1fr;gap:16px;}
  .course-card{padding:0;}
  .course-btn{width:100%;text-align:center;}
  #ai-panel{width:calc(100vw - 40px);right:20px;}
}
</style>

<script>
(function(){
  function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
  function renderPage(products){
    var eduProd = products.find(function(p){return p.id==='education';});
    var items = (eduProd && eduProd.items||[]).filter(function(it){return !it.hidden;});
  
  function makeCard(it, idx){
    var url = it.fileUrl||it.videoUrl||'#';
    var onClick = url!='#' ? 'onclick="openContent(event,\''+url+'\')" href="#"' : 'href="#"';
    var num = idx!==undefined ? '<div style="position:absolute;top:12px;right:12px;min-width:26px;height:26px;border-radius:13px;background:rgba(232,184,75,0.2);border:1px solid rgba(232,184,75,0.5);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#e8b84b;padding:0 6px;">'+(idx+1)+'</div>' : '';
    var coverSVG = '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">'+
      '<defs>'+
        '<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8b84b" stop-opacity="0.15"/><stop offset="100%" stop-color="#c9960c" stop-opacity="0.03"/></linearGradient>'+
        '<linearGradient id="lg" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#e8b84b" stop-opacity="0"/><stop offset="100%" stop-color="#e8b84b" stop-opacity="0.3"/></linearGradient>'+
      '</defs>'+
      '<rect width="320" height="200" fill="url(#cg)"/>'+
      '<circle cx="260" cy="40" r="60" fill="rgba(232,184,75,0.04)"/>'+
      '<circle cx="260" cy="40" r="35" fill="rgba(232,184,75,0.06)"/>'+
      '<line x1="30" y1="160" x2="290" y2="160" stroke="rgba(232,184,75,0.15)" stroke-width="1"/>'+
      '<line x1="30" y1="120" x2="290" y2="120" stroke="rgba(232,184,75,0.08)" stroke-width="1"/>'+
      '<line x1="30" y1="80" x2="290" y2="80" stroke="rgba(232,184,75,0.08)" stroke-width="1"/>'+
      '<polyline points="30,145 65,130 95,140 125,100 155,115 185,75 215,90 250,55 285,70" fill="none" stroke="rgba(232,184,75,0.25)" stroke-width="1.5"/>'+
      '<rect x="50" y="125" width="14" height="35" rx="2" fill="rgba(232,184,75,0.5)"/>'+
      '<rect x="80" y="118" width="14" height="42" rx="2" fill="rgba(232,184,75,0.35)"/>'+
      '<rect x="110" y="100" width="14" height="60" rx="2" fill="rgba(232,184,75,0.5)"/>'+
      '<rect x="140" y="110" width="14" height="50" rx="2" fill="rgba(232,184,75,0.35)"/>'+
      '<rect x="170" y="82" width="14" height="78" rx="2" fill="rgba(232,184,75,0.6)"/>'+
      '<rect x="200" y="92" width="14" height="68" rx="2" fill="rgba(232,184,75,0.4)"/>'+
      '<rect x="230" y="60" width="14" height="100" rx="2" fill="rgba(232,184,75,0.7)"/>'+
      '<rect x="260" y="75" width="14" height="85" rx="2" fill="rgba(232,184,75,0.5)"/>'+
      '<polygon points="170,82 184,82 184,65 198,65 185,50 172,65 184,65" fill="rgba(232,184,75,0.8)"/>'+
      '<rect x="30" y="15" width="120" height="48" rx="8" fill="rgba(20,19,24,0.85)" stroke="rgba(232,184,75,0.2)" stroke-width="1"/>'+
      '<text x="44" y="34" font-family="sans-serif" font-size="9" font-weight="700" fill="rgba(232,184,75,0.5)" letter-spacing="1">AG TECHNICALS</text>'+
      '<text x="44" y="52" font-family="sans-serif" font-size="13" font-weight="800" fill="rgba(232,184,75,0.9)">📘 COURSE</text>'+
      '</svg>';
    var cover = it.img
      ? '<div style="width:100%;height:200px;overflow:hidden;flex-shrink:0;"><img src="'+it.img+'" style="width:100%;height:100%;object-fit:cover;border-radius:14px 14px 0 0;"></div>'
      : '<div style="width:100%;height:200px;background:linear-gradient(160deg,#1c1728 0%,#0f0d14 100%);border-radius:14px 14px 0 0;flex-shrink:0;overflow:hidden;position:relative;">'+
          coverSVG+
        '</div>';
    return '<a class="course-card" style="position:relative;flex-direction:column;padding:0;overflow:hidden;border-radius:14px;display:flex;" '+onClick+'>'+num+
      cover+
      '<div style="padding:16px 18px 20px;display:flex;flex-direction:column;flex:1;">'+
        '<div class="course-tags" style="margin-bottom:8px;">'+
          (it.badge?'<span class="tag gold">'+it.badge+'</span>':'<span class="tag">Course</span>')+

    '</a>';
  }

  var mainList = document.getElementById('mainCourseList');
  if(mainList){
    mainList.innerHTML = items.length ? items.map(function(it,i){ return makeCard(it,i); }).join('') : '<div style="color:var(--t3);padding:20px 0;">No courses added yet.</div>';
  }

  // Hide downloadSection — no longer needed
  var dl = document.getElementById('downloadSection');
  if(dl) dl.style.display='none';
  }
  // Load from DB first, fallback to localStorage
  fetch('/api/config/ag_products').then(function(r){return r.json();}).then(function(j){

      renderPage(prods);
    } else {
      var prods = (function(){try{var v=localStorage.getItem('ag_products');return v?JSON.parse(v):[];}catch(e){return [];}})();
      renderPage(prods);
    }
  }).catch(function(){
    var prods = (function(){try{var v=localStorage.getItem('ag_products');return v?JSON.parse(v):[];}catch(e){return [];}})();
    renderPage(prods);
  });
})();
</script>

<script>
function requireLogin(){
  var user=null;
  try{user=JSON.parse(localStorage.getItem('ag_user'));}catch(e){}
  if(!user||!user.email){
    localStorage.setItem('ag_redirect_after_login',window.location.href);
    window.location.href='user-login.html';
    return false;
  }
  return true;
}
function openContent(e, url){ e.preventDefault();
  // LOGIN CHECK
  var user = null;
  try{ user = JSON.parse(localStorage.getItem('ag_user')); }catch(err){}
  if(!user || !user.email){
    // Not logged in — redirect to login
    localStorage.setItem('ag_redirect_after_login', window.location.href);
    window.location.href = 'user-login.html';
    return;
  }
  var modal = document.getElementById('contentModal');
  var frame = document.getElementById('contentFrame');
  modal.style.display='flex';
  frame.src = url;
  document.body.style.overflow='hidden';
}
function closeContent(){
  var modal = document.getElementById('contentModal');
  var frame = document.getElementById('contentFrame');
  modal.style.display='none';
  frame.src='';
  document.body.style.overflow='';
}
// Close on Escape key
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeContent(); });
</script>

<script>/* Gold stardust twinkling particles */
(function(){const c=document.createElement('canvas');c.id='bgAnim';c.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.18;';document.body.prepend(c);const ctx=c.getContext('2d');let W,H,stars=[];function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;stars=Array(70).fill(0).map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.5,phase:Math.random()*Math.PI*2,speed:0.01+Math.random()*0.02,color:Math.random()>0.5?'rgba(232,184,75,':'rgba(255,220,120,'}));}resize();window.addEventListener('resize',resize);function loop(){ctx.clearRect(0,0,W,H);stars.forEach(s=>{s.phase+=s.speed;const a=0.2+0.7*Math.abs(Math.sin(s.phase));ctx.shadowBlur=s.r*6*a;ctx.shadowColor=s.color+'0.8)';ctx.beginPath();ctx.arc(s.x,s.y,s.r*a,0,Math.PI*2);ctx.fillStyle=s.color+a+')';ctx.fill();ctx.shadowBlur=0;s.y-=0.1;s.x+=Math.sin(s.phase)*0.2;if(s.y<-10){s.y=H+10;s.x=Math.random()*W;}});requestAnimationFrame(loop);}loop();})();
</script>
<script>
(function(){
  const c=document.createElement('canvas');
  c.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
  document.body.prepend(c);
  const ctx=c.getContext('2d');
  let W,H,stars=[];
  const SYMS=['$','€','₿','∑','∆','π','%','★','◆'];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;
    stars=Array(55).fill(0).map(()=>({x:Math.random()*W,y:Math.random()*H,
    sym:Math.random()>.6?SYMS[Math.floor(Math.random()*SYMS.length)]:null,
    r:Math.random()*2.5+0.8,size:Math.random()*28+14,
    vx:(Math.random()-.5)*.3,vy:-(Math.random()*.4+.1),
    alpha:Math.random()*.5+.15,phase:Math.random()*Math.PI*2,spd:0.012+Math.random()*.015}));}
  resize();window.addEventListener('resize',resize);
  function loop(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.phase+=s.spd;s.x+=s.vx;s.y+=s.vy;
      if(s.y<-40){s.y=H+20;s.x=Math.random()*W;}
      const a=s.alpha*(0.6+0.4*Math.abs(Math.sin(s.phase)));
      ctx.globalAlpha=a;
      if(s.sym){
        ctx.font='bold '+s.size+'px serif';
        ctx.fillStyle='rgba(232,184,75,1)';
        ctx.shadowBlur=s.size*.7;ctx.shadowColor='rgba(201,150,12,0.8)';
        ctx.fillText(s.sym,s.x,s.y);
      } else {
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle='rgba(232,184,75,1)';
        ctx.shadowBlur=s.r*6;ctx.shadowColor='rgba(232,184,75,0.9)';
        ctx.fill();
      }
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    });
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
