<style>
:root{
  --bg:#0d0d0f; --card:#141318; --d2:#121114;
  --g5:#e8b84b; --g4:#c9960c;
  --t1:#ffffff; --t2:#c8c4d0; --t3:#a0a0b8;
  --border:#2a2736; --red:#f26d6d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 48px;border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--g5);text-decoration:none;letter-spacing:1px;}
.nav-back{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:13px;text-decoration:none;transition:color .2s;}
.nav-back:hover{color:var(--g5);}
.nav-back svg{width:16px;height:16px;}

/* HERO */
.hero{text-align:center;padding:80px 24px 48px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(232,184,75,0.3);border-radius:99px;padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--g5);text-transform:uppercase;margin-bottom:28px;}
.hero-badge-dot{width:7px;height:7px;border-radius:50%;background:var(--g5);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(36px,6vw,64px);font-weight:700;line-height:1.1;margin-bottom:20px;}
.hero h1 span{color:var(--g5);}
.hero p{font-size:17px;color:var(--t3);max-width:520px;margin:0 auto;line-height:1.7;}

/* COURSES */
.courses-section{max-width:980px;margin:0 auto;padding:20px 24px 80px;}
#mainCourseList{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:24px;}

/* ── CARD ── */
.course-card{
  display:flex;flex-direction:column;
  background:transparent;border:none;border-radius:20px;
  padding:0;margin-bottom:0;
  transition:transform .35s cubic-bezier(.22,.68,0,1.2),box-shadow .35s;
  cursor:pointer;text-decoration:none;
  position:relative;overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,0.5);
}
.course-card:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 16px 48px rgba(0,0,0,0.7),0 0 0 1px rgba(232,184,75,0.35);}

/* glow ring on hover */
.course-card::after{
  content:'';position:absolute;inset:-1px;border-radius:21px;
  background:linear-gradient(135deg,rgba(232,184,75,0.5),rgba(201,150,12,0.1),transparent 60%);
  opacity:0;transition:opacity .35s;z-index:0;pointer-events:none;
}
.course-card:hover::after{opacity:1;}

/* ── COVER SHELL ── */
.cc-cover{width:100%;height:210px;flex-shrink:0;overflow:hidden;position:relative;border-radius:20px 20px 0 0;}
.cc-cover img{width:100%;height:100%;object-fit:cover;}

/* ── GLASSMORPHISM INFO PANEL ── */
.cc-info{
  position:relative;z-index:2;
  padding:20px 22px 22px;
  background:linear-gradient(180deg,rgba(14,12,20,0.92) 0%,rgba(14,12,20,0.98) 100%);
  backdrop-filter:blur(12px);
  border-top:1px solid rgba(232,184,75,0.15);
}
.cc-badge{display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  color:var(--g5);margin-bottom:10px;
  background:rgba(232,184,75,0.1);border:1px solid rgba(232,184,75,0.25);
  padding:4px 10px;border-radius:99px;
}
.cc-badge-dot{width:5px;height:5px;border-radius:50%;background:var(--g5);flex-shrink:0;animation:pulse 2s infinite;}
.cc-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.3;}
.cc-desc{font-size:12.5px;color:rgba(255,255,255,0.45);line-height:1.55;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cc-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,rgba(232,184,75,0.18),rgba(201,150,12,0.1));
  border:1px solid rgba(232,184,75,0.35);
  color:var(--g5);font-size:13px;font-weight:700;
  padding:10px 20px;border-radius:10px;
  font-family:'Space Grotesk',sans-serif;
  transition:all .25s;width:100%;justify-content:center;
}
.course-card:hover .cc-btn{background:var(--g5);color:#0d0d0f;border-color:var(--g5);}

/* card number badge */
.cc-num{
  position:absolute;top:14px;left:14px;z-index:10;
  width:28px;height:28px;border-radius:50%;
  background:rgba(14,12,20,0.8);border:1px solid rgba(232,184,75,0.5);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:var(--g5);
  backdrop-filter:blur(8px);
}
/* old classes kept for compat */
.course-icon,.course-meta,.course-tags,.tag,.tag.gold,.tag-dot,.course-title,.course-desc,.course-btn{}

/* AI ASSISTANT */
#ai-bubble{
  position:fixed;bottom:28px;right:28px;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--g4),var(--g5));
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:0 4px 20px rgba(232,184,75,0.4);
  z-index:999;transition:transform .2s,box-shadow .2s;
}
#ai-bubble:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(232,184,75,0.55);}

#ai-panel{
  position:fixed;bottom:96px;right:28px;
  width:360px;max-height:520px;
  background:#16141c;border:1px solid var(--border);border-radius:18px;
  display:none;flex-direction:column;z-index:998;
  box-shadow:0 16px 48px rgba(0,0,0,0.6);overflow:hidden;
}
#ai-panel.open{display:flex;}

.ai-hdr{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--border);
  background:#1a1724;
}
.ai-hdr-icon{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--g4),var(--g5));display:flex;align-items:center;justify-content:center;font-size:16px;}
.ai-hdr-text{flex:1;}
.ai-hdr-name{font-weight:700;font-size:14px;color:var(--t1);}
.ai-hdr-sub{font-size:11px;color:var(--t3);}
.ai-close{background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;padding:4px;line-height:1;}
.ai-close:hover{color:var(--t1);}

#ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:200px;}
#ai-msgs::-webkit-scrollbar{width:4px;}
#ai-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.msg{max-width:85%;font-size:13.5px;line-height:1.55;padding:10px 14px;border-radius:12px;word-break:break-word;}
.msg.bot{background:#211f2d;color:var(--t2);border-radius:12px 12px 12px 2px;align-self:flex-start;}
.msg.user{background:linear-gradient(135deg,rgba(232,184,75,0.2),rgba(201,150,12,0.15));color:var(--t1);border:1px solid rgba(232,184,75,0.2);border-radius:12px 12px 2px 12px;align-self:flex-end;}
.msg.typing{color:var(--t3);font-style:italic;}

.ai-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:#1a1724;}
#ai-input{
  flex:1;background:#0d0d0f;border:1px solid var(--border);border-radius:10px;
  color:var(--t1);font-size:13px;padding:10px 14px;outline:none;font-family:'Inter',sans-serif;
  resize:none;
}
#ai-input:focus{border-color:rgba(232,184,75,0.4);}
#ai-input::placeholder{color:var(--t3);}
#ai-send{
  width:38px;height:38px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--g4),var(--g5));
  color:#0d0d0f;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity .2s;align-self:flex-end;
}
#ai-send:hover{opacity:.85;}
#ai-send:disabled{opacity:.4;cursor:not-allowed;}

@media(max-width:640px){
  nav{padding:14px 20px;}
  .hero{padding:48px 20px 32px;}
  .courses-section{padding:10px 16px 60px;}
  #mainCourseList{grid-template-columns:1fr;gap:20px;}
  .cc-cover{height:180px;}
  .course-card{padding:0;}
  .course-btn{width:100%;text-align:center;}
  #ai-panel{width:calc(100vw - 40px);right:20px;}
}
</style>

<script>
(function(){
  function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
  function renderPage(products){
    var eduProd = products.find(function(p){return p.id==='education';});
    var items = (eduProd && eduProd.items||[]).filter(function(it){return !it.hidden;});
  
  function makeCard(it, idx){
    var url = it.fileUrl||it.videoUrl||'#';
    var onClick = url!='#' ? 'onclick="openContent(event,\''+url+'\')" href="#"' : 'href="#"';

    /* ── per-card unique SVG covers (cycle by index) ── */
    var covers = [
      /* 0 – candlestick chart rising */
      '<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><linearGradient id="bg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0a2e"/><stop offset="100%" stop-color="#0a0a12"/></linearGradient><linearGradient id="area0" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8b84b" stop-opacity="0.35"/><stop offset="100%" stop-color="#e8b84b" stop-opacity="0"/></linearGradient></defs><rect width="400" height="210" fill="url(#bg0)"/><circle cx="320" cy="30" r="80" fill="rgba(232,184,75,0.05)"/><circle cx="320" cy="30" r="45" fill="rgba(232,184,75,0.07)"/><polygon points="30,175 80,140 130,155 180,110 230,125 280,75 340,55 400,35 400,210 30,210" fill="url(#area0)"/><polyline points="30,175 80,140 130,155 180,110 230,125 280,75 340,55 400,35" fill="none" stroke="#e8b84b" stroke-width="2.5" stroke-linejoin="round"/><circle cx="280" cy="75" r="5" fill="#e8b84b"/><circle cx="340" cy="55" r="5" fill="#e8b84b"/><rect x="55" y="140" width="10" height="30" rx="2" fill="#26a69a" opacity="0.8"/><rect x="105" y="148" width="10" height="20" rx="2" fill="#ef5350" opacity="0.8"/><rect x="155" y="105" width="10" height="40" rx="2" fill="#26a69a" opacity="0.8"/><rect x="205" y="118" width="10" height="22" rx="2" fill="#26a69a" opacity="0.8"/><rect x="255" y="70" width="10" height="45" rx="2" fill="#26a69a" opacity="0.8"/><rect x="315" y="48" width="10" height="35" rx="2" fill="#26a69a" opacity="0.8"/><text x="20" y="28" font-family="monospace" font-size="11" fill="rgba(232,184,75,0.9)" font-weight="700">AG TECHNICALS</text><text x="20" y="44" font-family="monospace" font-size="9" fill="rgba(232,184,75,0.45)">XAUUSD · LIVE CHART</text><rect x="300" y="15" width="85" height="22" rx="4" fill="rgba(38,166,154,0.15)" stroke="rgba(38,166,154,0.4)" stroke-width="1"/><text x="342" y="30" font-family="monospace" font-size="10" font-weight="800" fill="#26a69a" text-anchor="middle">+12.4%</text></svg>',
      /* 1 – golden grid / heatmap feel */
      '<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><linearGradient id="bg1" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#0d0a1a"/><stop offset="100%" stop-color="#130e20"/></linearGradient></defs><rect width="400" height="210" fill="url(#bg1)"/><line x1="0" y1="42" x2="400" y2="42" stroke="rgba(232,184,75,0.06)" stroke-width="1"/><line x1="0" y1="84" x2="400" y2="84" stroke="rgba(232,184,75,0.06)" stroke-width="1"/><line x1="0" y1="126" x2="400" y2="126" stroke="rgba(232,184,75,0.06)" stroke-width="1"/><line x1="0" y1="168" x2="400" y2="168" stroke="rgba(232,184,75,0.06)" stroke-width="1"/><line x1="80" y1="0" x2="80" y2="210" stroke="rgba(232,184,75,0.06)" stroke-width="1"/><line x1="160" y1="0" x2="160" y2="210" stroke="rgba(232,184,75,0.06)" stroke-width="1"/><line x1="240" y1="0" x2="240" y2="210" stroke="rgba(232,184,75,0.06)" stroke-width="1"/><line x1="320" y1="0" x2="320" y2="210" stroke="rgba(232,184,75,0.06)" stroke-width="1"/><circle cx="200" cy="105" r="90" fill="rgba(232,184,75,0.04)"/><circle cx="200" cy="105" r="60" fill="rgba(232,184,75,0.05)"/><circle cx="200" cy="105" r="32" fill="rgba(232,184,75,0.08)" stroke="rgba(232,184,75,0.3)" stroke-width="1.5"/><text x="200" y="100" text-anchor="middle" font-family="sans-serif" font-size="22" fill="rgba(232,184,75,0.9)">📚</text><text x="200" y="118" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(232,184,75,0.5)" letter-spacing="2">LEARN · GROW</text><text x="20" y="26" font-family="monospace" font-size="10" fill="rgba(232,184,75,0.8)" font-weight="700">AG TECHNICALS</text><line x1="20" y1="192" x2="380" y2="192" stroke="rgba(232,184,75,0.2)" stroke-width="1"/><text x="20" y="205" font-family="monospace" font-size="8" fill="rgba(232,184,75,0.35)">MASTER THE MARKETS</text></svg>',
      /* 2 – forex ticker tape */
      '<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0e1018"/><stop offset="100%" stop-color="#181020"/></linearGradient><linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8b84b" stop-opacity="0.8"/><stop offset="100%" stop-color="#c9960c" stop-opacity="0.5"/></linearGradient></defs><rect width="400" height="210" fill="url(#bg2)"/><rect x="0" y="0" width="400" height="32" fill="rgba(232,184,75,0.07)"/><text x="16" y="21" font-family="monospace" font-size="9" font-weight="700" fill="rgba(232,184,75,0.9)">XAUUSD 2318.40 ▲  EURUSD 1.0842 ▼  GBPUSD 1.2651 ▲  BTCUSD 62,440 ▲</text><rect x="20" y="55" width="32" height="80" rx="3" fill="url(#bar2)" opacity="0.7"/><rect x="62" y="75" width="32" height="60" rx="3" fill="rgba(239,83,80,0.7)"/><rect x="104" y="45" width="32" height="90" rx="3" fill="url(#bar2)" opacity="0.85"/><rect x="146" y="65" width="32" height="70" rx="3" fill="url(#bar2)" opacity="0.6"/><rect x="188" y="40" width="32" height="95" rx="3" fill="url(#bar2)"/><rect x="230" y="60" width="32" height="75" rx="3" fill="rgba(239,83,80,0.6)"/><rect x="272" y="35" width="32" height="100" rx="3" fill="url(#bar2)" opacity="0.9"/><rect x="314" y="50" width="32" height="85" rx="3" fill="url(#bar2)" opacity="0.75"/><line x1="20" y1="150" x2="360" y2="150" stroke="rgba(232,184,75,0.2)" stroke-width="1"/><polyline points="36,130 78,118 120,105 162,108 204,90 246,95 288,75 330,80" fill="none" stroke="#e8b84b" stroke-width="1.5" opacity="0.6"/><text x="20" y="175" font-family="monospace" font-size="10" fill="rgba(232,184,75,0.7)" font-weight="800">TECHNICAL ANALYSIS</text><text x="20" y="190" font-family="monospace" font-size="8" fill="rgba(232,184,75,0.35)">PRICE ACTION · STRUCTURE · CONFLUENCES</text></svg>',
    ];
    var svgCover = covers[idx % covers.length];

    var cover = it.img
      ? '<div class="cc-cover"><img src="'+it.img+'" alt="'+( it.name||'Course')+'"></div>'
      : '<div class="cc-cover" style="background:#0d0a18;">'+svgCover+'</div>';

    var numBadge = idx!==undefined ? '<div class="cc-num">'+(idx+1)+'</div>' : '';
    var badge = it.badge||'Course';

    return '<a class="course-card" '+onClick+'>'+
      numBadge+
      cover+
      '<div class="cc-info">'+
        '<div class="cc-badge"><span class="cc-badge-dot"></span>'+badge+'</div>'+
        '<div class="cc-title">'+(it.name||'')+'</div>'+
        '<div class="cc-desc">'+(it.desc||'')+'</div>'+
        '<div class="cc-btn">Open Course <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>'+
      '</div>'+
    '</a>';
  }

  var mainList = document.getElementById('mainCourseList');
  if(mainList){
    mainList.innerHTML = items.length ? items.map(function(it,i){ return makeCard(it,i); }).join('') : '<div style="color:var(--t3);padding:20px 0;">No courses added yet.</div>';
  }

  // Hide downloadSection — no longer needed
  var dl = document.getElementById('downloadSection');
  if(dl) dl.style.display='none';
  }
  // Load from DB first, fallback to localStorage
  fetch('/api/config/ag_products').then(function(r){return r.json();}).then(function(j){
    if(j.ok && j.value){
      var prods = JSON.parse(j.value);
      localStorage.setItem('ag_products', JSON.stringify(prods));
      renderPage(prods);
    } else {
      var prods = (function(){try{var v=localStorage.getItem('ag_products');return v?JSON.parse(v):[];}catch(e){return [];}})();
      renderPage(prods);
    }
  }).catch(function(){
    var prods = (function(){try{var v=localStorage.getItem('ag_products');return v?JSON.parse(v):[];}catch(e){return [];}})();
    renderPage(prods);
  });
})();
</script>

<script>
function requireLogin(){
  var user=null;
  try{user=JSON.parse(localStorage.getItem('ag_user'));}catch(e){}
  if(!user||!user.email){
    localStorage.setItem('ag_redirect_after_login',window.location.href);
    window.location.href='user-login.html';
    return false;
  }
  return true;
}
function openContent(e, url){ e.preventDefault();
  // LOGIN CHECK
  var user = null;
  try{ user = JSON.parse(localStorage.getItem('ag_user')); }catch(err){}
  if(!user || !user.email){
    // Not logged in — redirect to login
    localStorage.setItem('ag_redirect_after_login', window.location.href);
    window.location.href = 'user-login.html';
    return;
  }
  var modal = document.getElementById('contentModal');
  var frame = document.getElementById('contentFrame');
  modal.style.display='flex';
  frame.src = url;
  document.body.style.overflow='hidden';
}
function closeContent(){
  var modal = document.getElementById('contentModal');
  var frame = document.getElementById('contentFrame');
  modal.style.display='none';
  frame.src='';
  document.body.style.overflow='';
}
// Close on Escape key
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeContent(); });
</script>

<script>
(function(){
  const c=document.createElement('canvas');
  c.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
  document.body.prepend(c);
  const ctx=c.getContext('2d');
  let W,H,stars=[];
  const SYMS=['$','€','₿','∑','∆','π','%','★','◆'];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;
    stars=Array(55).fill(0).map(()=>({x:Math.random()*W,y:Math.random()*H,
    sym:Math.random()>.6?SYMS[Math.floor(Math.random()*SYMS.length)]:null,
    r:Math.random()*2.5+0.8,size:Math.random()*28+14,
    vx:(Math.random()-.5)*.3,vy:-(Math.random()*.4+.1),
    alpha:Math.random()*.5+.15,phase:Math.random()*Math.PI*2,spd:0.012+Math.random()*.015}));}
  resize();window.addEventListener('resize',resize);
  function loop(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.phase+=s.spd;s.x+=s.vx;s.y+=s.vy;
      if(s.y<-40){s.y=H+20;s.x=Math.random()*W;}
      const a=s.alpha*(0.6+0.4*Math.abs(Math.sin(s.phase)));
      ctx.globalAlpha=a;
      if(s.sym){
        ctx.font='bold '+s.size+'px serif';
        ctx.fillStyle='rgba(232,184,75,1)';
        ctx.shadowBlur=s.size*.7;ctx.shadowColor='rgba(201,150,12,0.8)';
        ctx.fillText(s.sym,s.x,s.y);
      } else {
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle='rgba(232,184,75,1)';
        ctx.shadowBlur=s.r*6;ctx.shadowColor='rgba(232,184,75,0.9)';
        ctx.fill();
      }
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    });
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
