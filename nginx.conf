upstream backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 3000;
    root /app;
    index index.html;
    client_max_body_size 100M;

    # ── Static files ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /uploaded_files/ {
        alias /var/data/uploaded_files/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── API proxy with fallback ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 100M;

        # If backend is down — return JSON error instead of Railway crash page
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"ok":false,"error":"Server restarting — please try again in 10 seconds"}';
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
