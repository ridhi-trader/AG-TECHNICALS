upstream backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── Abuse protection (per real client IP) ──
limit_req_zone $binary_remote_addr zone=ag_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=ag_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ag_chat:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ag_page:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ag_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 3000;
    server_tokens off;
    # Railway edge sets X-Real-IP to the real client IP (documented)
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Real-IP;
    limit_conn ag_conn 40;
    limit_req zone=ag_page burst=80 nodelay;
    client_body_timeout 30s;
    client_header_timeout 15s;
    large_client_header_buffers 4 8k;
    root /app;
    open_file_cache max=500 inactive=60s;
    open_file_cache_valid 30s;
    sendfile on;
    tcp_nopush on;
    index index.html;
    # Behind Railway's proxy the container listens on 3000; never put that port (or the internal host) in redirects
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 100M;

    # ── Never serve source / config / docs files (only web assets are public) ──
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location ^~ /.well-known/ { try_files $uri =404; }
    location ~* \.(py|pyc|md|toml|sh|conf|txt|yml|yaml|json|lock|log|env|ini|cfg)$ { return 404; }
    location ~* /(Dockerfile|__pycache__|\.rebuild) { return 404; }
    location ~ /\. { return 404; }
    # Bot / scanner probes for software we do not run: drop connection silently
    location ~* \.(php|asp|aspx|jsp|cgi|cfm|sql|bak|old|swp|git|svn|ini)(/|$) { return 444; }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|pma|cgi-bin|vendor|backup|actuator|console|server-status) { return 444; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Clean URLs: /index and /index.html -> /  (match the ORIGINAL request URI, so the internal
    # redirect from / to /index.html done by the index directive does not loop)
    if ($request_uri ~* "^/index(\.html)?(\?.*)?$") { return 301 /; }

    # ── Static files ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri.html $uri/ =404;

        # Inject the shared footer script (Privacy / Terms / Contact / Risk / Support links)
        # into every HTML page, so new pages and products get it without editing them.
        # ag-footer.js is idempotent, so pages that also include it explicitly are fine.
        sub_filter '</head>' '<link rel="stylesheet" href="/ag-theme.css?v=1"><script>try{var t=localStorage.getItem("ag_theme");if(t==="auto")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";if((t==="light"||t==="sun")&&!/troublepie|admin/i.test(location.pathname))document.documentElement.setAttribute("data-theme",t)}catch(e){}</script></head>';
        sub_filter '</body>' '<script src="/ag-footer.js?v=8"></script></body>';
        sub_filter_once on;

        include /app/ag-sec.conf;
        location ~* \.html$ {
            include /app/ag-sec.conf;
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location ~* \.(js|css)$ {
            include /app/ag-sec.conf;
            add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        }
        location ~* \.(png|jpg|jpeg|webp|gif|svg|ico)$ {
            include /app/ag-sec.conf;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        }
    }

    location ^~ /uploaded_files/ {
        alias /var/data/uploaded_files/;
        expires 7d;
        include /app/ag-sec.conf;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        add_header Cache-Control "public";
    }

    # ── API proxy with fallback ───────────────────────────────────────────────
    location ^~ /api/auth/ {
        limit_req zone=ag_auth burst=10 nodelay;
        include /app/ag-sec.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        client_max_body_size 20k;
    }
    location ^~ /api/admin-forgot-otp {
        limit_req zone=ag_auth burst=3 nodelay;
        include /app/ag-sec.conf;
        proxy_pass http://backend/api/admin-forgot-otp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        client_max_body_size 20k;
    }
    location ^~ /api/chat {
        limit_req zone=ag_chat burst=8 nodelay;
        include /app/ag-sec.conf;
        proxy_pass http://backend/api/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }
    location ^~ /api/ {
        limit_req zone=ag_api burst=40 nodelay;
        include /app/ag-sec.conf;
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 100M;

        # If backend is down — return JSON error instead of Railway crash page
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"ok":false,"error":"Server restarting — please try again in 10 seconds"}';
    }

    # ── Security headers ──────────────────────────────────────────────────────
    include /app/ag-sec.conf;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/x-javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 500;
}
