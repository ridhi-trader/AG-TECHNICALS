<style>
:root{--bg:#0d0d0f;--card:#141318;--g5:#e8b84b;--g4:#c9960c;--t1:#ffffff;--t2:#c8c4d0;--t3:#a0a0b8;--border:#2a2736;--red:#f26d6d;--green:#4ade80;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;-webkit-user-select:none;-moz-user-select:none;user-select:none;}
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 48px;border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--g5);text-decoration:none;letter-spacing:1px;}
.nav-back{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:13px;text-decoration:none;transition:color .2s;}
.nav-back:hover{color:var(--g5);}

@media(max-width:600px){nav{padding:14px 20px;}}

/* HERO */
.hero{text-align:center;padding:72px 24px 40px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(232,184,75,0.3);border-radius:99px;padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--g5);text-transform:uppercase;margin-bottom:24px;}

@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.hero h1 span{color:var(--g5);}
.hero p{font-size:16px;color:var(--t3);max-width:480px;margin:0 auto;line-height:1.7;}

/* GUIDE LIST */
.section{max-width:860px;margin:0 auto;padding:8px 24px 80px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:20px;}

.guide-card{display:flex;align-items:center;gap:24px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 28px;margin-bottom:16px;transition:border-color .2s,transform .2s;cursor:pointer;position:relative;overflow:hidden;}
.guide-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(232,184,75,0.04) 0%,transparent 60%);opacity:0;transition:opacity .3s;}

.guide-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--t1);margin-bottom:6px;}
.guide-desc{font-size:13px;color:var(--t3);line-height:1.6;max-width:560px;}
.guide-btn{flex-shrink:0;background:rgba(232,184,75,0.12);border:1px solid rgba(232,184,75,0.3);color:var(--g5);font-size:14px;font-weight:600;padding:11px 22px;border-radius:10px;white-space:nowrap;transition:all .2s;font-family:'Space Grotesk',sans-serif;}

.reader-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}

.reader-wrap{max-width:760px;margin:0 auto;padding:48px 24px 80px;}
.reader-tag{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--g5);margin-bottom:10px;}

.rule-box .rule-title{font-size:11px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.wa-cta{margin-top:48px;background:rgba(232,184,75,0.05);border:1px solid rgba(232,184,75,0.18);border-radius:14px;padding:28px 24px;text-align:center;}

<script>
const GUIDES = [
  {
    id:'order-flow', icon:'📊', tag:'Market Structure', level:'Intermediate', time:'12 min',
    title:'How To Read Order Flow',
    desc:'Understand what institutions are actually doing — delta, absorption, and volume profile explained.',
    body:`
      <h2>What Is Order Flow?</h2>
      <p>Order flow is the real-time record of buy and sell orders entering the market. Unlike price action which shows you <strong>what happened</strong>, order flow shows you <strong>who is doing it and how aggressively</strong>.</p>
      <div class="hl-box">💡 Think of price as the scoreboard — order flow is the actual game being played on the field.</div>
      <h2>Why It Matters</h2>
      <p>Retail traders trade on what price <em>looks like</em>. Institutions leave footprints in order flow. Learning to read those footprints puts you on the right side of the trade.</p>
      <ul>
        <li><strong>Absorption</strong> — Large sellers absorb buyer pressure without price falling. Sign of strong hands.</li>
        <li><strong>Exhaustion</strong> — Price moves but volume dries up. Move is running out of fuel.</li>
        <li><strong>Imbalance</strong> — More aggressive buyers than sellers — price accelerates.</li>
      </ul>
      <h2>Key Concepts</h2>
      <h3>1. Delta</h3>
      <p>Delta = (Buying volume) − (Selling volume) on each candle. Positive delta = more aggressive buyers. Negative delta = more aggressive sellers. Watch when delta diverges from price.</p>
      <div class="rule-box"><div class="rule-title">AG Rule</div>Price makes new high but delta makes lower high → bearish divergence. High probability reversal setup.</div>
      <h3>2. Volume Profile</h3>
      <p>Shows price levels where the most volume traded. High volume nodes = strong support/resistance. Low volume nodes = price moves through fast.</p>
      <h3>3. POC (Point Of Control)</h3>
      <p>The price level with the highest volume in a session. Institutions defend POC. Price often returns to it. Use it as a magnet for targets.</p>
      <h2>How To Apply On Chart</h2>
      <ol>
        <li>Mark the previous session's POC on your chart every day.</li>
        <li>Watch how price reacts when it returns to that level.</li>
        <li>If delta diverges at a key level — take the trade.</li>
        <li>Use volume profile to identify where stop hunts are likely to end.</li>
      </ol>
      <div class="tip-box">✅ Best markets: Gold (XAU/USD), NAS100, BTC/USD — high volume, clear institutional footprints.</div>
      <div class="warn-box">⚠️ Order flow is a confirmation tool — not a standalone entry trigger. Always combine with structure and context.</div>
      <div class="wa-cta"><h3>Want Custom Analysis?</h3><p>Our analysts read order flow on your charts — contact us.</p><a href="https://wa.me/919876543210" target="_blank">💬 Message On WhatsApp</a></div>`
  },
  {
    id:'stop-loss', icon:'🎯', tag:'Risk Management', level:'Beginner', time:'8 min',
    title:'How To Set A Stop Loss',
    desc:'Structure-based stops, ATR stops, and why fixed pip stops get you hunted every time.',
    body:`
      <h2>Why Most Traders Get Stopped Out Early</h2>
      <p>The #1 reason traders lose money isn't the entry — it's placing the stop loss in the wrong place. Too tight = hunted. Too wide = destroys risk-reward.</p>
      <h2>The 3 Types Of Stop Loss</h2>
      <h3>1. Structure-Based SL (Best)</h3>
      <p>Place your stop <strong>beyond a significant structural level</strong> — the last major swing high (for sells) or swing low (for buys). If that level breaks, your thesis is wrong. Get out.</p>
      <div class="hl-box">💡 Rule: SL goes where the market has to go to prove you wrong — not where your account can afford.</div>
      <h3>2. ATR-Based SL</h3>
      <p>Use Average True Range to set a dynamic stop. Place SL at 1.5x–2x ATR from entry. Adapts to market volatility.</p>
      <h3>3. Fixed Pip SL (Avoid)</h3>
      <p>Fixed 20-pip or 30-pip stops ignore market structure. The market doesn't care about your pip count. Fastest way to get consistently hunted.</p>
      <h2>The Stop Hunt Reality</h2>
      <p>Smart money knows exactly where retail places stops — just below round numbers, just below obvious swing lows. Price sweeps those levels, triggers stops, then reverses.</p>
      <div class="rule-box"><div class="rule-title">AG Rule</div>Add 3–5 pips buffer beyond the structural level. Don't place your stop exactly at the swing low — place it just below it.</div>
      <h2>Risk Per Trade</h2>
      <ul>
        <li>Never risk more than <strong>1–2% of your account</strong> per trade.</li>
        <li>Calculate lot size backwards from your SL distance and risk amount.</li>
        <li>Formula: Lot = (Account × Risk%) ÷ (SL in pips × pip value)</li>
      </ul>
      <div class="tip-box">✅ A 1% risk account will survive 100 consecutive losses. Focus on surviving first.</div>
      <div class="wa-cta"><h3>Want A Custom Risk Plan?</h3><p>We build personalised risk frameworks for your account size and style.</p><a href="https://wa.me/919876543210" target="_blank">💬 Message On WhatsApp</a></div>`
  },
  {
    id:'sessions', icon:'🕐', tag:'Market Timing', level:'Beginner', time:'7 min',
    title:'Trading Session Timing Guide',
    desc:'When to trade, when to sleep — London, New York, Asian session breakdown for Indian traders.',
    body:`
      <h2>The 3 Major Sessions</h2>
      <p>Forex and most markets run 24 hours — but not all hours are equal. Most institutional volume happens in three windows. Trade in these. Sleep during the rest.</p>
      <h3>1. Asian Session (Tokyo)</h3>
      <p><strong>Time (IST):</strong> 2:30 AM – 11:30 AM<br><strong>Character:</strong> Low volatility, range-bound. Price sets up the liquidity that London will hunt.<br><strong>AG Take:</strong> Mark the Asian high and low every day — London will target them.</p>
      <h3>2. London Session</h3>
      <p><strong>Time (IST):</strong> 1:30 PM – 5:30 PM<br><strong>Character:</strong> Highest volume. Major moves initiate here. Stop hunts in first 30 minutes.<br><strong>AG Take:</strong> Wait for the first 15-minute candle to close, then look for direction.</p>
      <h3>3. New York Session</h3>
      <p><strong>Time (IST):</strong> 6:30 PM – 11:00 PM<br><strong>Character:</strong> Overlaps with London for 2 hours — peak volatility. News releases here.<br><strong>AG Take:</strong> Best setups in first 2 hours of NY. After 9 PM IST volume drops sharply.</p>
      <div class="rule-box"><div class="rule-title">AG Session Rules</div><ul style="padding-left:16px;margin-top:4px;"><li>Mark Asian high/low before London opens.</li><li>First 30 min of London = stop hunt time. Don't enter blindly.</li><li>Best entries: London open + NY open overlap (6:30–8:30 PM IST).</li><li>Avoid 30 min before major news releases.</li></ul></div>
      <h2>Avoid Dead Hours</h2>
      <p>Between NY close and Asian open (11 PM – 2:30 AM IST) the market is dead. Spreads widen, moves are random, no institutional participation.</p>
      <div class="tip-box">✅ Trading only London and NY open will cut your losing trades by 30% — simply by being in the right time window.</div>
      <div class="wa-cta"><h3>Need A Custom Session Plan?</h3><p>We map sessions to your specific market and style.</p><a href="https://wa.me/919876543210" target="_blank">💬 Message On WhatsApp</a></div>`
  },
  {
    id:'prop-firm', icon:'🏆', tag:'Prop Trading', level:'Intermediate', time:'10 min',
    title:'Prop Firm Rules — How To Pass',
    desc:'Daily loss limits, drawdown rules, news restrictions — everything you need to pass FTMO and similar challenges.',
    body:`
      <h2>What Is A Prop Firm?</h2>
      <p>Prop firms give you capital to trade — you keep 70–90% of profits. In exchange, you must follow strict rules. Break them once — account terminated.</p>
      <div class="rule-box"><div class="rule-title">Common Prop Firm Rules</div><ul style="padding-left:16px;margin-top:4px;"><li><strong>Daily Loss Limit:</strong> Usually 4–5%. Hit it = day over.</li><li><strong>Max Drawdown:</strong> Usually 8–10% total. Hit it = account terminated.</li><li><strong>Min Trading Days:</strong> 4–5 days in evaluation phase.</li><li><strong>No News Trading:</strong> Many firms ban trading 2 min before/after high-impact news.</li><li><strong>No Weekend Holding:</strong> Close all positions before Friday close.</li><li><strong>Profit Target:</strong> 8–10% Phase 1, 5% Phase 2.</li></ul></div>
      <h2>The Mindset Shift Required</h2>
      <p>Most traders fail not because they can't trade — but because they approach it like a casino. <strong>Capital preservation first, profit second.</strong></p>
      <h3>Daily Loss Limit Management</h3>
      <p>If you're at 50% of your daily loss limit — stop trading for the day. Most accounts blow from revenge trading after early losses.</p>
      <h2>AG's Prop Firm Strategy</h2>
      <ol>
        <li>Start with 0.5% risk per trade — no exceptions.</li>
        <li>Trade only London and NY open — ignore Asian session.</li>
        <li>Max 2 losses in a row → stop for the day. Mandatory.</li>
        <li>News trading: close 5 min before, re-enter after candle close post-news.</li>
        <li>Friday 8 PM IST: close everything. No weekend holds.</li>
      </ol>
      <div class="tip-box">✅ AG Technicals has helped members pass FTMO, MyForexFunds, and E8 challenges using these exact rules.</div>
      <div class="warn-box">⚠️ Not financial advice. Prop firm rules vary — always read your specific firm's terms.</div>
      <div class="wa-cta"><h3>Want Prop Firm Coaching?</h3><p>We guide you through the full challenge process.</p><a href="https://wa.me/919876543210" target="_blank">💬 Message On WhatsApp</a></div>`
  },
  {
    id:'gold-trading', icon:'✨', tag:'Gold / XAU', level:'Intermediate', time:'9 min',
    title:'Gold (XAU/USD) Trading Guide',
    desc:'How AG Technicals trades gold — sessions, key levels, COT data, and DXY relationship.',
    body:`
      <h2>Why Gold Is Our Primary Market</h2>
      <p>Gold is the most institutionally driven market in the world. Clear structure, strong trends, and predictable reactions to macro events make it ideal for the AG methodology.</p>
      <h2>Gold's Unique Characteristics</h2>
      <ul>
        <li><strong>Inverse DXY Relationship:</strong> Dollar strengthens → Gold usually falls. Dollar weakens → Gold usually rises. Track DXY every session.</li>
        <li><strong>Safe Haven Demand:</strong> Geopolitical events, market fear → Gold spikes. Learn to identify these events before they move price.</li>
        <li><strong>COT Data:</strong> Managed Money (hedge funds) positioning tells you where smart money is leaning. We publish this in our Gold Dossier.</li>
      </ul>
      <h2>Best Times To Trade Gold</h2>
      <p><strong>London Open (1:30–3:30 PM IST):</strong> Highest gold volume. Most valid setups.<br><strong>NY Open (6:30–8:30 PM IST):</strong> Second best. US data releases move gold here.<br><strong>Asian session:</strong> Usually range-bound for gold. Use for planning, not execution.</p>
      <div class="rule-box"><div class="rule-title">AG Gold Rules</div><ul style="padding-left:16px;margin-top:4px;"><li>Always check DXY direction before entering gold.</li><li>Key round numbers ($2600, $2650, $2700) = stop hunt magnets.</li><li>Don't hold gold over major Fed announcements without a wide SL.</li><li>COT net long > 150k contracts = crowded long = watch for reversal.</li></ul></div>
      <h2>Structure On Gold Charts</h2>
      <p>Gold respects H4 and Daily structure more than most pairs. Build your bias on Daily, refine on H4, execute on H1 or M15. Never trade gold on M1 or M5 — noise only.</p>
      <div class="tip-box">✅ Read the AG Gold Dossier every week — it gives you the full institutional picture before you trade.</div>
      <div class="wa-cta"><h3>Get Gold Signals From AG</h3><p>Our analysts post live gold setups. Join the community.</p><a href="https://wa.me/919876543210" target="_blank">💬 Message On WhatsApp</a></div>`
  },
];

function renderList(){
  const el = document.getElementById('guideList');
  el.innerHTML = GUIDES.map((g,i)=>`
    <div class="guide-card" onclick="openReader('${g.id}')">
      <div class="guide-icon">${g.icon}</div>
      <div class="guide-meta">
        <div class="guide-tags">
          <span class="tag gold">${g.tag}</span>
          <span class="tag-dot">·</span>
          <span class="tag">${g.level}</span>
          <span class="tag-dot">·</span>
          <span class="tag">⏱ ${g.time}</span>
        </div>
        <div class="guide-title">${g.title}</div>
        <div class="guide-desc">${g.desc}</div>
      </div>
      <div class="guide-btn">Read Guide →</div>
    </div>`).join('');
}

function openReader(id){
  const g = GUIDES.find(x=>x.id===id); if(!g) return;
  document.getElementById('rTag').textContent = g.tag + ' · AG Technicals';
  document.getElementById('rTitle').textContent = g.title;
  document.getElementById('rMeta').innerHTML = `<span>📚 ${g.level}</span><span>⏱ ${g.time} read</span><span>🔒 Private — On-Site Only</span>`;
  document.getElementById('rBody').innerHTML = g.body;
  const ov = document.getElementById('readerOverlay');
  ov.classList.add('open');
  ov.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeReader(){
  document.getElementById('readerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeReader();
  if((e.ctrlKey||e.metaKey) && ['c','u','s','a','p','i'].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener('contextmenu', e=>e.preventDefault());

renderList();
</script>
<script src="ag-assistant.js"></script>
