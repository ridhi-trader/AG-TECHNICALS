upstream backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 3000;
    root /app;
    open_file_cache max=500 inactive=60s;
    open_file_cache_valid 30s;
    sendfile on;
    tcp_nopush on;
    index index.html;
    # Behind Railway's proxy the container listens on 3000; never put that port (or the internal host) in redirects
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 100M;

    # ── Never serve source / config / docs files (only web assets are public) ──
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location ^~ /.well-known/ { try_files $uri =404; }
    location ~* \.(py|pyc|md|toml|sh|conf|txt|yml|yaml|json|lock|log|env|ini|cfg)$ { return 404; }
    location ~* /(Dockerfile|__pycache__|\.rebuild) { return 404; }
    location ~ /\. { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Clean URLs: /index and /index.html -> /  (match the ORIGINAL request URI, so the internal
    # redirect from / to /index.html done by the index directive does not loop)
    if ($request_uri ~* "^/index(\.html)?(\?.*)?$") { return 301 /; }

    # ── Static files ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri.html $uri/ =404;

        # Inject the shared footer script (Privacy / Terms / Contact / Risk / Support links)
        # into every HTML page, so new pages and products get it without editing them.
        # ag-footer.js is idempotent, so pages that also include it explicitly are fine.
        sub_filter '</body>' '<script src="/ag-footer.js"></script></body>';
        sub_filter_once on;

        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location ~* \.(js|css)$ {
            add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        }
        location ~* \.(png|jpg|jpeg|webp|gif|svg|ico)$ {
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        }
    }

    location ^~ /uploaded_files/ {
        alias /var/data/uploaded_files/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── API proxy with fallback ───────────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 100M;

        # If backend is down — return JSON error instead of Railway crash page
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"ok":false,"error":"Server restarting — please try again in 10 seconds"}';
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/x-javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 500;
}
