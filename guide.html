<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guides — AG Technicals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--card:#141318;--g5:#e8b84b;--g4:#c9960c;--t1:#ffffff;--t2:#c8c4d0;--t3:#a0a0b8;--border:#2a2736;--red:#f26d6d;--green:#4ade80;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;-webkit-user-select:none;-moz-user-select:none;user-select:none;}
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 48px;border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--g5);text-decoration:none;letter-spacing:1px;}
.nav-back{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:13px;text-decoration:none;transition:color .2s;}
.nav-back:hover{color:var(--g5);}
.nav-back svg{width:16px;height:16px;}
@media(max-width:600px){nav{padding:14px 20px;}}

/* HERO */
.hero{text-align:center;padding:72px 24px 40px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(232,184,75,0.3);border-radius:99px;padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--g5);text-transform:uppercase;margin-bottom:24px;}
.hero-badge-dot{width:7px;height:7px;border-radius:50%;background:var(--g5);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,5vw,56px);font-weight:800;line-height:1.1;margin-bottom:14px;}
.hero h1 span{color:var(--g5);}
.hero p{font-size:16px;color:var(--t3);max-width:480px;margin:0 auto;line-height:1.7;}

/* GUIDE LIST */
.section{max-width:860px;margin:0 auto;padding:8px 24px 80px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:20px;}

.guide-card{display:flex;align-items:center;gap:24px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 28px;margin-bottom:16px;transition:border-color .2s,transform .2s;cursor:pointer;position:relative;overflow:hidden;}
.guide-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(232,184,75,0.04) 0%,transparent 60%);opacity:0;transition:opacity .3s;}
.guide-card:hover{border-color:rgba(232,184,75,0.4);transform:translateY(-2px);}
.guide-card:hover::before{opacity:1;}
.guide-icon{font-size:30px;flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:rgba(232,184,75,0.08);border-radius:13px;border:1px solid rgba(232,184,75,0.15);}
.guide-meta{flex:1;}
.guide-tags{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.tag{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);}
.tag.gold{color:var(--g5);}
.tag-dot{color:var(--t3);font-size:10px;}
.guide-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--t1);margin-bottom:6px;}
.guide-desc{font-size:13px;color:var(--t3);line-height:1.6;max-width:560px;}
.guide-btn{flex-shrink:0;background:rgba(232,184,75,0.12);border:1px solid rgba(232,184,75,0.3);color:var(--g5);font-size:14px;font-weight:600;padding:11px 22px;border-radius:10px;white-space:nowrap;transition:all .2s;font-family:'Space Grotesk',sans-serif;}
.guide-card:hover .guide-btn{background:var(--g5);color:#0d0d0f;}

/* READER OVERLAY */
.reader-overlay{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;}
.reader-overlay.open{display:block;}
.reader-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
.reader-back{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:13px;cursor:pointer;border:none;background:none;transition:color .2s;}
.reader-back:hover{color:var(--g5);}
.reader-wrap{max-width:760px;margin:0 auto;padding:48px 24px 80px;}
.reader-tag{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--g5);margin-bottom:10px;}
.reader-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,4vw,38px);font-weight:800;color:#fff;margin-bottom:12px;line-height:1.2;}
.reader-meta{display:flex;gap:16px;font-size:12px;color:var(--t3);margin-bottom:36px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.reader-body{font-size:15px;color:var(--t2);line-height:1.9;}
.reader-body h2{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:#fff;margin:36px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.reader-body h3{font-size:15px;font-weight:700;color:var(--g5);margin:22px 0 8px;}
.reader-body p{margin-bottom:14px;}
.reader-body ul,.reader-body ol{padding-left:20px;margin-bottom:14px;}
.reader-body li{margin-bottom:8px;}
.reader-body strong{color:#fff;font-weight:700;}
.hl-box{background:rgba(232,184,75,0.07);border-left:3px solid var(--g5);border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0;font-size:14px;}
.warn-box{background:rgba(242,109,109,0.06);border-left:3px solid var(--red);border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0;font-size:14px;color:#f8c4c4;}
.tip-box{background:rgba(74,222,128,0.06);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:14px 18px;margin:18px 0;font-size:14px;color:#b8f5d0;}
.rule-box{background:#141318;border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin:16px 0;}
.rule-box .rule-title{font-size:11px;font-weight:700;color:var(--g5);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.wa-cta{margin-top:48px;background:rgba(232,184,75,0.05);border:1px solid rgba(232,184,75,0.18);border-radius:14px;padding:28px 24px;text-align:center;}
.wa-cta h3{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#fff;margin-bottom:6px;}
.wa-cta p{font-size:13px;color:var(--t3);margin-bottom:16px;}
.wa-cta a{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#e8b84b,#c9960c);color:#000;font-weight:700;font-size:14px;padding:11px 24px;border-radius:9px;text-decoration:none;transition:all .2s;pointer-events:all;}
.wa-cta a:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(201,150,12,0.4);}
.reader-body *{pointer-events:none;}
.reader-body a{pointer-events:all;}
@media(max-width:600px){.guide-card{flex-wrap:wrap;}.guide-btn{width:100%;text-align:center;}.reader-nav{padding:14px 20px;}.reader-wrap{padding:32px 16px 60px;}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">AG Technicals</a>
  <a href="index.html" class="nav-back">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 12L6 8l4-4"/></svg>
    Back To Site
  </a>
</nav>

<div class="hero">
  <div class="hero-badge"><span class="hero-badge-dot"></span>Written Playbooks</div>
  <h1>AG <span>Guides</span></h1>
  <p>Step-by-step written guides built from 9+ years of real screen time. Read on-site only — fully private.</p>
</div>

<div class="section">
  <div class="section-label" style="color:#e8b84b;border-bottom:1px solid rgba(232,184,75,.2);padding-bottom:10px;margin-bottom:20px;">⚡ EA Guides — MT5 Expert Advisors</div>
  <div id="eaGuideList"></div>
  <div class="section-label" style="color:#a78bfa;border-bottom:1px solid rgba(167,139,250,.2);padding-bottom:10px;margin-bottom:20px;margin-top:36px;">📺 TradingView Guides — Indicators & Alerts</div>
  <div id="tvGuideList"></div>
</div>

<!-- READER OVERLAY -->
<div class="reader-overlay" id="readerOverlay">
  <div class="reader-nav">
    <button class="reader-back" onclick="closeReader()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M10 12L6 8l4-4"/></svg>
      All Guides
    </button>
    <span style="font-size:12px;color:var(--t3);">AG Technicals · Private</span>
  </div>
  <div class="reader-wrap">
    <div class="reader-tag" id="rTag"></div>
    <div class="reader-title" id="rTitle"></div>
    <div class="reader-meta" id="rMeta"></div>
    <div class="reader-body" id="rBody"></div>
  </div>
</div>

<script>


// Load from localStorage — same key as admin
function getGuideItems(){
  try{
    var prods = JSON.parse(localStorage.getItem('ag_products')||'null') ||
                JSON.parse(localStorage.getItem('products')||'null');
    if(!prods) return {ea:[], tv:[]};
    var guide = prods.find(function(p){return p.id==='guide';});
    if(!guide||!guide.items) return {ea:[], tv:[]};
    var ea=[], tv=[], isTv=false;
    guide.items.forEach(function(it){
      if(it.badge==='SECTION'){
        isTv = it.name.toLowerCase().indexOf('trading')>-1 || it.name.toLowerCase().indexOf('tv')>-1;
        return;
      }
      if(it.hidden) return;
      if(isTv) tv.push(it); else ea.push(it);
    });
    return {ea:ea, tv:tv};
  }catch(e){return {ea:[],tv:[]};}
}
const GUIDES=[];

function makeCard(g, i, isTV){
  const inner = `
      <div class="guide-icon">${g.icon}</div>
      <div class="guide-meta">
        <div class="guide-tags">
          <span class="tag ${isTV?'':'gold'}" style="${isTV?'background:rgba(167,139,250,.1);color:#a78bfa;border-color:rgba(167,139,250,.3);':''}">${g.tag}</span>
          <span class="tag-dot">·</span>
          <span class="tag">${g.level}</span>
          <span class="tag-dot">·</span>
          <span class="tag">📖 ${g.time}</span>
        </div>
        <div class="guide-title">${g.title}</div>
        <div class="guide-desc">${g.desc}</div>
      </div>
      <div class="guide-btn">${isTV?'Read Guide →':'Open Guide →'}</div>`;
  if(g.url) return `<a class="guide-card" href="${g.url}" style="text-decoration:none;">${inner}</a>`;
  return `<div class="guide-card" style="cursor:default;opacity:.8;">${inner}</div>`;
}

function renderList(){
  var items = getGuideItems();
  var ea = items.ea, tv = items.tv;
  document.getElementById('eaGuideList').innerHTML = ea.length ? ea.map(function(g,i){
    return makeCard({icon:'📄',tag:g.badge||'EA Guide',level:'All Levels',time:'Guide',title:g.name,desc:g.desc||'',url:g.videoUrl||g.fileUrl||''},i,false);
  }).join('') : '<div style="color:var(--t3);font-size:13px;padding:12px 0;">No EA guides added yet.</div>';
  document.getElementById('tvGuideList').innerHTML = tv.length ? tv.map(function(g,i){
    return makeCard({icon:'📺',tag:g.badge||'TV Guide',level:'All Levels',time:'Guide',title:g.name,desc:g.desc||'',url:g.videoUrl||g.fileUrl||''},i,true);
  }).join('') : '<div style="color:var(--t3);font-size:13px;padding:12px 0;">No TradingView guides added yet.</div>';
  const el = document.getElementById('guideList'); // legacy fallback
  // External guides (full pages) first — KEEP FOR localStorage guides below
  const extCards = EA_GUIDES.map(g=>`
    <a class="guide-card" href="${g.url}" style="text-decoration:none;">
      <div class="guide-icon">${g.icon}</div>
      <div class="guide-meta">
        <div class="guide-tags">
          <span class="tag gold">${g.tag}</span>
          <span class="tag-dot">·</span>
          <span class="tag">${g.level}</span>
          <span class="tag-dot">·</span>
          <span class="tag">📖 ${g.time}</span>
        </div>
        <div class="guide-title">${g.title}</div>
        <div class="guide-desc">${g.desc}</div>
      </div>
      <div class="guide-btn">Open Guide →</div>
    </a>`).join('');
  // Inline guides
  const inlineCards = GUIDES.map((g,i)=>`
    <div class="guide-card" onclick="openReader('${g.id}')">
      <div class="guide-icon">${g.icon}</div>
      <div class="guide-meta">
        <div class="guide-tags">
          <span class="tag gold">${g.tag}</span>
          <span class="tag-dot">·</span>
          <span class="tag">${g.level}</span>
          <span class="tag-dot">·</span>
          <span class="tag">⏱ ${g.time}</span>
        </div>
        <div class="guide-title">${g.title}</div>
        <div class="guide-desc">${g.desc}</div>
      </div>
      <div class="guide-btn">Read Guide →</div>
    </div>`).join('');
  el.innerHTML = extCards + inlineCards;
}

function openReader(id){
  const g = GUIDES.find(x=>x.id===id); if(!g) return;
  document.getElementById('rTag').textContent = g.tag + ' · AG Technicals';
  document.getElementById('rTitle').textContent = g.title;
  document.getElementById('rMeta').innerHTML = `<span>📚 ${g.level}</span><span>⏱ ${g.time} read</span><span>🔒 Private — On-Site Only</span>`;
  document.getElementById('rBody').innerHTML = g.body;
  const ov = document.getElementById('readerOverlay');
  ov.classList.add('open');
  ov.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeReader(){
  document.getElementById('readerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeReader();
  if((e.ctrlKey||e.metaKey) && ['c','u','s','a','p','i'].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener('contextmenu', e=>e.preventDefault());

renderList();
</script>
<script src="ag-assistant.js"></script>
</body>
</html>
